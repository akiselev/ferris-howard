name = "FerrisHoward"
version = "0.1.0"
defaultTargets = ["FerrisHoward", "Tests"]

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "v4.32.2"

# The language. Globbed rather than rooted: `lake build` compiles every module under
# `FerrisHoward/`, so a file that no one imports still has to compile. That is what
# Mathlib's `mk_all --check` buys with an import-completeness check, obtained here
# structurally instead (PLAN I1).
#
# The root module is listed explicitly: `X.+` does not include `X`, and without it Lake
# does not consider the root a workspace module at all — `import FerrisHoward` then
# silently resolves to whatever stale olean is on disk.
[[lean_lib]]
name = "FerrisHoward"
globs = ["FerrisHoward", "FerrisHoward.+"]

# Fixtures. Deliberate errors are legal here as long as every one of them is captured by
# `#guard_msgs`; an uncaptured error fails the build, which is the point.
# Archived feasibility spikes live in `lean/spikes/`, outside any lib: several fail by
# design, and they are run by hand with `lake env lean spikes/<file>.lean`.
[[lean_lib]]
name = "Tests"
globs = ["Tests", "Tests.+"]

# The B1 extractor as a program. Its own imports are `Lean` only; the environment it walks
# is loaded at runtime, so building this does not drag Mathlib through the linker.
[[lean_exe]]
name = "atlas_extract"
root = "AtlasExtract"
supportInterpreter = true

# `emit-lean`: publication-grade Lean out (ADR-006). Its output has no FH dependency, and
# the emittable lint fails the run if any FH construct does not expand.
[[lean_exe]]
name = "fh_emit"
root = "FhEmit"
supportInterpreter = true

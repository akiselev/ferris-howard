[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "fh-atlas"
description = "Query a Ferris-Howard Atlas slice from Python: one load, many queries"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
classifiers = [
    "Programming Language :: Rust",
    "Programming Language :: Python :: Implementation :: CPython",
]
dynamic = ["version"]

[tool.maturin]
module-name = "fh_atlas"
# One wheel per platform, every Python >=3.10 (python-api.md §1).
features = ["pyo3/abi3-py310"]
# `fh_atlas.pyi` and `py.typed` beside this file are picked up by maturin on their own;
# listing them under `include` as well puts a second, unimported copy at the wheel root.
